name: FUI-RS CI

on:
  push:
    branches: [main]
    paths: &fui_rs_ci_inputs
      - '.github/workflows/fui-rs-ci.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'update-deps.sh'
      - 'eslint.config.ts'
      - 'scripts/ci/**'
      - 'v2/abi/**'
      - 'v2/core/include/**'
      - 'v2/ui/include/**'
      - 'v2/fui-rs/**'
  pull_request:
    paths: *fui_rs_ci_inputs

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: v2/fui-rs/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Install committed dependencies
        run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Assert the runtime package is framework-agnostic
        run: |
          node - <<'NODE'
          const runtime = require('./node_modules/@effindomv2/runtime/package.json');
          if (runtime.dependencies?.['@assemblyscript/loader'] !== undefined) {
            throw new Error('@effindomv2/runtime must not depend on @assemblyscript/loader.');
          }
          NODE
      - name: Test idempotent crates.io publication handling
        run: node --test scripts/ci/publish-crate-idempotently.test.mjs
      - name: Lint, typecheck, and run Rust checks
        run: |
          npm run lint
          npm run typecheck
          npm --workspace v2/fui-rs run lint:rust
          npm run test
          npm --workspace v2/fui-rs run test:crate-package
      - name: Build the browser demo
        run: npm run build
      - name: Run FUI-RS runtime package boundary smoke
        run: npm run test:runtime-boundary
      - name: Run browser integration tests
        run: npm run test:browser:release-gate
