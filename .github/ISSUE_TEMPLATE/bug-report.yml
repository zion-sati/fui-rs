name: Bug report
description: Report reproducible FUI-RS behaviour that differs across native or web targets.
title: "[Bug]: "
labels:
  - bug
body:
  - type: input
    id: version
    attributes:
      label: FUI-RS version
    validations:
      required: true
  - type: dropdown
    id: host
    attributes:
      label: Host
      options:
        - Native macOS
        - Native Windows
        - Native Linux
        - Browser
        - Multiple hosts
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Operating system, architecture, and browser where applicable
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
      description: Include retained UI code, input sequence, and exact commands.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour and logs
    validations:
      required: true

