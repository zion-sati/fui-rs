[package]
name = "fui-rs"
version = "0.1.24"
edition = "2021"
description = "Retained Rust UI for native desktop and WebAssembly applications"
repository = "https://github.com/zion-sati/fui-rs"
homepage = "https://effindom.dev"
documentation = "https://docs.rs/fui-rs"
readme = "README.md"
license = "AGPL-3.0-only"
keywords = ["effindom", "ui", "gui", "wasm", "desktop"]
categories = ["gui", "wasm"]
publish = ["crates-io"]
include = [
  "/src/**/*.rs",
  "/tests/**/*.rs",
  "/Cargo.toml",
  "/Cargo.lock",
  "/README.md",
  "/LICENSE.md",
  "/LICENSES/AGPL-3.0-only.md",
  "/COMMERCIAL.md",
]

[package.metadata.effindom]
runtime-version = "0.2.8"
core-abi = 2
ui-abi = 1

[features]
default = []
worker-runtime = []
native-runtime = []

[dependencies]

[lib]
name = "fui"
crate-type = ["rlib"]
